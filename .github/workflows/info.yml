name: info

on:
  push:
    branches:
      - main
    paths:
      - "info/**"
      - ".github/workflows/info.yml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/docker-build.yml
    with:
      service: info
    secrets: inherit

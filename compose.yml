services:
  personal:
    image: doughmination/personal:latest
    container_name: personal
    ports:
      - "127.0.0.1:4050:4050"
    restart: unless-stopped

  blog:
    image: doughmination/blog:latest
    container_name: blog
    ports:
      - "127.0.0.1:4010:4010"
    restart: unless-stopped

  info:
    image: doughmination/info:latest
    container_name: info
    ports:
      - "127.0.0.1:4020:4020"
    restart: unless-stopped

  system:
    image: doughmination/system:latest
    container_name: system
    environment:
      - NODE_ENV=production
    ports:
      - "127.0.0.1:4030:4030"

  status:
    image: doughmination/status:latest
    container_name: status
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - "./.env:/app/.env:ro"
      - "./.env.keys:/app/.env.keys:ro"
      - "./status-data:/app/data"
      # Read-only Docker socket: lets the status page report each container's
      # backend state (running/health) alongside the public URL check.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped

  inbox:
    image: doughmination/mailbox:latest
    container_name: inbox
    ports:
      - "127.0.0.1:4040:4040"
    networks:
      - infra
    volumes:
      - "./.env:/app/.env:ro"
      - "./.env.keys:/app/.env.keys:ro"
      - "./mail-data:/app/data"
    restart: unless-stopped

networks:
  infra:
    external: true

volumes:
  backend_data:
  backend_avatars:
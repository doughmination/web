services:
  personal:
    build:
      context: ./personal
      dockerfile: Dockerfile
    container_name: personal
    ports:
      - "127.0.0.1:5002:5002"
    restart: unless-stopped

  info:
    build:
      context: ./info
      dockerfile: Dockerfile
    container_name: info
    ports:
      - "127.0.0.1:4050:4050"
    restart: unless-stopped

  system:
    build:
      context: ./system
      dockerfile: Dockerfile
    container_name: system
    environment:
      - NODE_ENV=production
    ports:
      - "127.0.0.1:5000:5000"

  inbox:
    build:
      context: ./mailbox
      dockerfile: Dockerfile
    container_name: inbox
    ports:
      - "127.0.0.1:4040:4040"
    networks:
      - infra
    volumes:
      - "./.env:/app/.env:ro"
      - "./.env.keys:/app/.env.keys:ro"
      - "./mail-data:/app/data"
    restart: unless-stopped

  music:
    build:
      context: ./music
      dockerfile: Dockerfile
    container_name: music
    ports:
      - "127.0.0.1:4060:4060"
    volumes:
      - "./.env:/app/.env:ro"
      - "./.env.keys:/app/.env.keys:ro"
      - "./music-data:/app/data"
    networks:
      - infra
    restart: unless-stopped

networks:
  infra:
    external: true

volumes:
  backend_data:
  backend_avatars:


# LOCAL DEV ONLY. Spins up throwaway Postgres + Redis on localhost so you can
# run `bun run dev` without the monorepo. In production the app is built by the
# root ../compose.yml and talks to the external `infra` network (db + redis).
#
#   docker compose up -d     # start local db + redis
#   bun run dev              # run the app against them
#
# Point your local .env at:
#   MUSIC_DATABASE_URL=postgres://music:music@localhost:5432/music
#   MUSIC_REDIS_URL=redis://localhost:6379/0

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music
    ports:
      - "5432:5432"
    volumes:
      - devpg:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - devredis:/data

volumes:
  devpg:
  devredis:
